      - { title: 荀子, relation: 著 }

  - id: laozi
    name: 老子
    courtesy: 李耳
    dynasty: 春秋
    school: 道家
    notes: 道家学派创始人
    works:
      - { title: 道德经, relation: 著 }

  - id: zhuangzi
    name: 庄子
    courtesy: 周
    dynasty: 战国
    school: 道家
