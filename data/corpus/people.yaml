# 人物关系表 手工维护数据（seed 进 PostgreSQL）
# relation 方向：person_id --relation--> target_person_id
# 如「颜回 --师从--> 孔子」读作「颜回师从孔子」。

people:
  - id: kongzi
    name: 孔子
    courtesy: 仲尼
    dynasty: 春秋
    school: 儒家
    notes: 儒家学派创始人
    works:
      - { title: 论语, relation: 著, note: 弟子及再传弟子编纂（述而不作） }
      - { title: 春秋, relation: 修, note: 据鲁史修订 }
      - { title: 周易, relation: 传, note: 十翼相传为孔子所作 }

  - id: yanhui
    name: 颜回
    courtesy: 子渊
    dynasty: 春秋
    school: 儒家
    notes: 孔子最得意门生，位列七十二贤之首
    relations:
      - { target: kongzi, relation: 师从 }

  - id: zengzi
    name: 曾子
    courtesy: 子舆
    dynasty: 春秋
    school: 儒家
    works:
      - { title: 大学, relation: 传, note: 相传为曾子所作 }
      - { title: 孝经, relation: 传, note: 相传为曾子所作 }
    relations:
      - { target: kongzi, relation: 师从 }

  - id: zisi
    name: 子思
    courtesy: 孔伋
    dynasty: 战国
    school: 儒家
    notes: 孔子之孙
    works:
      - { title: 中庸, relation: 传, note: 相传为子思所作 }
    relations:
      - { target: kongzi, relation: 祖孙, note: 孔子之孙 }
      - { target: zengzi, relation: 师从 }

  - id: mengzi
    name: 孟子
    courtesy: 子舆
    dynasty: 战国
    school: 儒家
    notes: 亚圣
    works:
      - { title: 孟子, relation: 著 }
    relations:
      - { target: kongzi, relation: 私淑 }
      - { target: zisi, relation: 私淑, note: 孟子私淑子思之门 }

  - id: xunzi
    name: 荀子
    courtesy: 卿
    dynasty: 战国
    school: 儒家
    notes: 隆礼重法，韩非、李斯之师
