# 识文新裁 语料清单（单一数据源）
# 扩展古籍只需在此增删一行 books 条目，代码无需改动。
#
# 许可说明：
#   - 原文皆为公版（公有领域）；
#   - 转写 JSON 取自 Guopop/chinese-philosophy（CText 镜像），该仓库未标注许可，
#     仅用于学术研究与演示，切勿商用。
#
# 字段说明：
#   id       —— 英文短标识（入库主键、chunk id 前缀）
#   name     —— 书名
#   author   —— 权威作者标注（覆盖 raw JSON 中的错误标注，如论语被误标「战国」）
#   dynasty  —— 成书朝代
#   category —— 四部分类（经部/子部/史部/集部）
#   file     —— 相对 source_base 的路径
#   max_chars / overlap —— 分块参数（可覆盖 defaults）

source_base: "https://raw.githubusercontent.com/Guopop/chinese-philosophy/main/back/new"

defaults:
  max_chars: 500
  overlap: 80

books:
  # ===== 经部 =====
  - id: lunyu
    name: 论语
    author: 孔子及其弟子
    dynasty: 春秋
    category: 经部
    file: 儒家/论语.json
  - id: mengzi
    name: 孟子
    author: 孟子及其弟子
    dynasty: 战国
    category: 经部
    file: 儒家/孟子.json
  - id: daxue
    name: 大学
    author: 曾子（传）
    dynasty: 战国
    category: 经部
    file: 儒家/大学.json
  - id: zhongyong
    name: 中庸
    author: 子思（传）
    dynasty: 战国
    category: 经部
    file: 儒家/中庸.json
  - id: xiaojing
    name: 孝经
    author: 曾子（传）
    dynasty: 战国
    category: 经部
    file: 儒家/孝经.json
  - id: shijing
    name: 诗经
    author: 佚名（孔子编订）
    dynasty: 先秦
    category: 经部
    file: 文学/诗经.json
  - id: shangshu
    name: 尚书
    author: 佚名
    dynasty: 先秦
    category: 经部
    file: 儒家/尚书.json
  - id: zhouyi
    name: 周易
