services:
  backend:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 不映射公网端口；由 nginx 反代 /api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiwen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-shiwen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiwen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    # 多阶段构建：node 构建前端 → nginx 托管静态 + 反代 /api（服务器免装 Node）
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # 宿主机 8090 → 容器 80（nginx.conf 内仍 listen 80）。
    # 服务器 80/8080 已被其他正式服务占用，识文新裁独立占 8090，不与其冲突。
    ports:
      - "8090:80"
      # - "8443:443"  # HTTPS 证书后置（暂未启用）
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
